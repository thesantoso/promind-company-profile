name: Deploy web

# Push ke main (termasuk commit dari portal admin) membangun dan men-deploy situs.
# Jadwal harian membangun ulang supaya lowongan yang kedaluwarsa hilang tanpa perlu diedit.
# Target ditentukan variabel repo DEPLOY_TARGET (staging | production; default staging).
# Saat cutover (tahap 4): set DEPLOY_TARGET=production, atau jalankan manual dengan target production.

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-web.yml']
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target deploy'
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      TARGET: ${{ inputs.target || vars.DEPLOY_TARGET || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Unit and content tests
        run: npx vitest run
      - name: Resolve site settings for the target
        run: |
          if [ "$TARGET" = "production" ]; then
            echo "SITE_URL=${{ vars.SITE_URL_PRODUCTION || 'https://promind.co.id' }}" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=${{ vars.SITE_URL_STAGING || 'https://staging.promind.co.id' }}" >> "$GITHUB_ENV"
          fi
          # Kunci situs Turnstile bersifat publik (bukan rahasia); variabel repo boleh menimpanya.
          echo "PUBLIC_TURNSTILE_SITEKEY=${{ vars.TURNSTILE_SITEKEY || '0x4AAAAAAFpT4HV5XoBn8rg0' }}" >> "$GITHUB_ENV"
      - name: Build
        run: npm run build
      - name: Deploy to Cloudflare (${{ env.TARGET }})
        run: npx wrangler deploy --env "$TARGET"
