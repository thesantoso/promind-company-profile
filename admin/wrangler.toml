name = "promind-admin"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
workers_dev = false

[assets]
directory = "./ui/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "promind-admin"
database_id = "00000000-0000-0000-0000-000000000000" # diisi saat provisioning (Task 10)
migrations_dir = "migrations"

[vars]
GITHUB_REPO = "thesantoso/promind-company-profile"
GITHUB_BRANCH = "main"
ADMIN_ORIGIN = "https://admin.promind.co.id"
SITE_ORIGIN = "https://promind.co.id"
