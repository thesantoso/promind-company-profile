name = "promind-admin"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "admin.promind.co.id", custom_domain = true }]

[assets]
directory = "./ui/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "promind-admin"
database_id = "73635d3f-74b9-474a-9058-a00987fd89f6" # diisi saat provisioning (Task 10)
migrations_dir = "migrations"

[vars]
GITHUB_REPO = "thesantoso/promind-company-profile"
# Staging membaca/menulis branch revamp; saat cutover (setelah merge ke main) ubah ke "main"
GITHUB_BRANCH = "revamp"
ADMIN_ORIGIN = "https://admin.promind.co.id"
# Staging dulu; saat cutover ubah ke https://promind.co.id
SITE_ORIGIN = "https://staging.promind.co.id"
CONTACT_MAILER_URL = "https://forms.promind.co.id/contact-mailer.php"
